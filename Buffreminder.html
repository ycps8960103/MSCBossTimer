<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>風之谷祈禱提醒</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2a26;--mut:#7a766b;--line:#e2dccd;--acc:#2f7d6d;--warn:#d6452f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1c;--card:#242726;--ink:#ece8dd;--mut:#9a968a;--line:#3a3e3c;--acc:#4fb39f;--warn:#ff6b52}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:300px;margin:12px auto;padding:0 12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px 4px;text-align:center;cursor:pointer;user-select:none}
.t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.s{font-size:10px;color:var(--mut);white-space:nowrap;line-height:1.3}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0}
.f{height:100%;width:0;background:var(--acc)}
.mini.alert{border-color:var(--warn);animation:fl .6s infinite alternate}
.mini.alert .t,.mini.alert .s{color:var(--warn)}
@keyframes fl{to{box-shadow:0 0 0 2px var(--warn)}}
#set{margin-top:12px;font-size:13px;color:var(--mut)}
#set label{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
input[type=number]{width:70px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.hint{margin-top:10px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="mini" id="mini" title="點一下＝已吸 Buff，重新計時">
    <div class="t">2:00</div>
    <div class="bar"><div class="f"></div></div>
    <div class="s">點一下開始</div>
  </div>
  <div id="set">
    <label>Buff 時間（秒）<input type="number" id="dur" min="10" max="3600" value="120"></label>
    <label>剩幾秒時提醒<input type="number" id="rem" min="0" max="3600" value="15"></label>
    <label>時間到自動重新計時<input type="checkbox" id="auto" checked></label>
    <div class="row"><button id="test">測試語音</button><button id="pip">懸浮小視窗</button></div>
    <div class="hint">點小視窗任何位置（或按空白鍵）＝開始／已吸 Buff 重新計時。提醒時會唸「剩餘 X 秒鐘」。</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let ctx=null,end=0,total=120,timer=null,tw=window,W=window,alerted=false,spoken=false,nodes=[],running=false,lastGo=0;
const views=[];
function mk(box){const v={box,t:box.querySelector('.t'),f:box.querySelector('.f'),s:box.querySelector('.s')};views.push(v);return v}
mk($('mini'));
const paint=fn=>views.forEach(fn);
try{const s=JSON.parse(localStorage.getItem('prayer')||'{}');if(s.dur)$('dur').value=s.dur;if(s.rem!=null)$('rem').value=s.rem;if(s.auto!=null)$('auto').checked=s.auto}catch(e){}
function save(){try{localStorage.setItem('prayer',JSON.stringify({dur:$('dur').value,rem:$('rem').value,auto:$('auto').checked}))}catch(e){}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function speak(t){
  try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}
function remText(){const r=Math.max(0,+$('rem').value||0);return r>0?'剩餘'+r+'秒鐘':'時間到'}
function say(){if(spoken)return;spoken=true;speak(remText())}
function sched(at,fn){
  const c=audio(),o=c.createOscillator(),g=c.createGain();g.gain.value=0;
  o.connect(g).connect(c.destination);o.onended=fn;o.start();o.stop(c.currentTime+Math.max(0.01,at));nodes.push(o);
}
function clearSched(){nodes.forEach(n=>{n.onended=null;try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});nodes=[];try{speechSynthesis.cancel()}catch(e){}}
function stopTicker(){try{tw.clearInterval(timer)}catch(e){}}
function setTicker(){stopTicker();tw=W;timer=W.setInterval(tick,200)}
function start(){
  save();
  total=Math.max(10,+$('dur').value||120);
  const rem=Math.min(total,Math.max(0,+$('rem').value||0));
  clearSched();
  end=Date.now()+total*1000;alerted=false;spoken=false;running=true;
  paint(v=>v.box.classList.remove('alert'));document.title='風之谷祈禱提醒';
  try{audio();sched(total-rem,say);sched(total,()=>{if($('auto').checked)start()})}catch(e){}
  setTicker();tick();
}
// 點擊／空白鍵共用入口；失敗時直接把錯誤顯示在小視窗上方便排查
function go(){
  const n=Date.now();if(n-lastGo<300)return;lastGo=n;
  try{start()}catch(err){paint(v=>v.s.textContent='錯誤：'+err.message)}
}
function tick(){
  const left=(end-Date.now())/1000,rem=+$('rem').value||0;
  if(left<=-0.5&&$('auto').checked){start();return}
  if(left<=rem&&!alerted){alerted=true;paint(v=>v.box.classList.add('alert'));document.title='⚠ 該吸祈禱囉';say()}
  const txt=(left<=0&&!$('auto').checked)?'已結束，點一下重計':(alerted?'該吸了！點一下重計':'倒數中・點一下重計');
  paint(v=>{v.t.textContent=fmt(left);v.f.style.width=Math.max(0,left/total*100)+'%';v.s.textContent=txt});
  if(left<=0&&!$('auto').checked){stopTicker();running=false}
}
function reset(){
  stopTicker();clearSched();running=false;alerted=false;
  document.title='風之谷祈禱提醒';
  paint(v=>{v.box.classList.remove('alert');v.t.textContent=fmt(+$('dur').value||120);v.f.style.width='0';v.s.textContent='點一下開始'});
}
$('mini').addEventListener('pointerdown',go);
$('mini').addEventListener('click',go);
$('test').onclick=()=>{try{audio()}catch(e){}speak(remText())};
$('dur').onchange=()=>{save();if(!running)reset()};
$('rem').onchange=save;$('auto').onchange=save;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();go()}});
// 懸浮視窗：在視窗內重新建立一份小計時器，事件直接綁在該視窗上
$('pip').onclick=async()=>{
  if(!window.documentPictureInPicture){alert('此瀏覽器不支援置頂懸浮視窗，請改用 Chrome 或 Edge。');return}
  try{
    const w=await documentPictureInPicture.requestWindow({width:110,height:60});
    const d=w.document;
    d.head.append(document.querySelector('style').cloneNode(true));
    d.body.style.cssText='margin:0;padding:2px';
    const box=d.createElement('div');box.className='mini';
    box.innerHTML='<div class="t"></div><div class="bar"><div class="f"></div></div><div class="s"></div>';
    d.body.append(box);
    const v=mk(box),m=views[0];
    v.t.textContent=m.t.textContent;v.f.style.width=m.f.style.width;v.s.textContent=m.s.textContent;
    if(alerted)box.classList.add('alert');
    try{w.resizeTo(110,60)}catch(e){}
    d.addEventListener('pointerdown',go);d.addEventListener('click',go);
    d.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();go()}});
    W=w;if(running)setTicker();
    w.addEventListener('pagehide',()=>{const i=views.indexOf(v);if(i>0)views.splice(i,1);W=window;if(running)setTicker()});
  }catch(e){alert('無法開啟懸浮視窗：'+e.message)}
};
reset();
</script>
</body>
</html>
